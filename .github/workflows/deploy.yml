name: Test and deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI: vercel@64.7.0

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Check secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for s in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!s}" ] || { echo "::error::Repository secret $s is not set (Settings → Secrets and variables → Actions)"; exit 1; }
          done
      - run: npm install --global ${{ env.VERCEL_CLI }}
      # Builds on Vercel (where Sensitive env vars like DATABASE_URL are readable) and streams the
      # build log here. The vercel-build script runs database migrations, then next build.
      - name: Build and deploy on Vercel
        id: deploy
        run: |
          set -o pipefail
          vercel deploy --prod --logs --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee deploy.log

  e2e:
    needs: deploy
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
